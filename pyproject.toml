[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "market-pulse"
version = "0.1.0"
description = "Terminal crypto price pulse powered by the CoinGecko free API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jack Rentschler" }]
dependencies = ["requests>=2.32.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
market-pulse = "market_pulse:main"

[tool.setuptools]
py-modules = ["market_pulse"]

[tool.pytest.ini_options]
# Tests import market_pulse from the repo root. Bare `pytest` (unlike
# `python -m pytest`) does not put the working directory on sys.path, so make
# it explicit rather than depending on how the runner is invoked.
pythonpath = ["."]
testpaths = ["tests"]
